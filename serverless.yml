service: sypher-ai-backend

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  timeout: 29
  environment:
    GEMINI_API_KEY: ${env:GEMINI_API_KEY}
    NODE_ENV: production
  httpApi:
    cors: true

functions:
  api:
    handler: dist/server.handler
    events:
      - httpApi: '*'

package:
  patterns:
    - '!**'
    - 'dist/server.cjs'
    - 'dist/server.cjs.map'