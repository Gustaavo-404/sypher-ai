service: sypher-ai-backend

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  timeout: 60 
  environment:
    GEMINI_API_KEY: ${env:GEMINI_API_KEY}
    NODE_ENV: production

functions:
  api:
    handler: dist/server.handler
    timeout: 90
    url: true

package:
  patterns:
    - '!**'
    - 'dist/server.cjs'
    - 'dist/server.cjs.map'